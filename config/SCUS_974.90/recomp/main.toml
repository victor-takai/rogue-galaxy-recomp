# No [mmio] table. ps2_recomp already routes an access whose address it can
# resolve statically through runtime->Load/Store when that address is a
# hardware register, and READ/WRITE check at run time otherwise. An [mmio]
# entry overrides the resolved address, and ps2_analyzer's table gave only the
# page base (0x10000000 for 137 sites): every timer access listed went to
# Timer 0's count. The game's libkernl timers broke on it (Timer 2 lost its
# clock source, so DelayThread never woke).
