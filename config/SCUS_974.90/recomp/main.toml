# ps2_recomp configuration: Rogue Galaxy NTSC-U main executable (SCUS_974.90).
# Paths are relative to the repository root; run ps2_recomp from there.
[general]
input = "disc/SCUS_974.90"
ghidra_output = "config/SCUS_974.90/functions_main.csv"
output = "build/generated/main"
single_file_output = false
low_memory_mode = false
output_worker_threads = 0  # 0 = auto

# Syscalls are translated at the `syscall` instruction; COP0 and cache ops
# are patched (framework defaults, as in DQ8-Recompiled).
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Calls to fixed addresses read their function from a dense table of this
# image's function entries instead of the dispatcher's lookup (patch 0030).
# Main executable only: the overlays' tables are renamed globals.
direct_call_table = true

# SDK functions the runtime implements, as handler@address. Map names carry
# their address, so nothing binds by name alone: this list is the whole set.
#
# Seed (phase 1): the bindings DQ8-Recompiled uses with the same framework
# (its pin 888ec47 is the parent of ours) and the same SDK generation, located
# here by ps2_analyzer's SDK signatures and RGDecomp's names, minus handlers
# that are TODOs in our pin (sceDmaRecv*/Watch/Pause, sceDeci2*, sceTty*,
# sceMpegGetPictureRAW8*): those throw, so the guest code runs instead.
# Like DQ8 it leaves the allocator (malloc and friends), sceGifPk*, syscall
# wrappers and private SDK entry points translated, and unlike DQ8 the stdio
# functions too (see the libc group). Phase 3 validates each.
# `python setup.py check` verifies every entry against the map and the pinned
# runtime. A trailing comment gives the map name where it differs.
